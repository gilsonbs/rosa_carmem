<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fundo branco com bordas suaves -->
  <rect width="100" height="100" fill="#ffffff" rx="14"/>

  <!-- Flor rosa (lado esquerdo) -->
  <!-- Pétalas externas -->
  <ellipse cx="22" cy="38" rx="7" ry="12" fill="#d4638a" transform="rotate(-30 22 38)" opacity="0.95"/>
  <ellipse cx="16" cy="30" rx="6" ry="10" fill="#e07aa0" transform="rotate(-60 16 30)" opacity="0.9"/>
  <ellipse cx="28" cy="33" rx="6" ry="10" fill="#c45580" transform="rotate(0 28 33)" opacity="0.9"/>
  <ellipse cx="13" cy="42" rx="5" ry="9" fill="#e8879b" transform="rotate(-80 13 42)" opacity="0.85"/>
  <ellipse cx="28" cy="46" rx="5" ry="8" fill="#cc6088" transform="rotate(20 28 46)" opacity="0.85"/>
  <!-- Centro da flor -->
  <circle cx="21" cy="38" r="5.5" fill="#f5c040" opacity="0.95"/>
  <circle cx="21" cy="38" r="3" fill="#e6a800"/>

  <!-- Caule -->
  <path d="M21 50 Q19 62 17 74" stroke="#4a7a38" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Folhas -->
  <path d="M19 64 Q10 57 14 48 Q17 60 19 64Z" fill="#5a8a48"/>
  <path d="M20 70 Q28 63 24 54 Q21 66 20 70Z" fill="#5a8a48"/>

  <!-- Monograma RC em serif elegante -->
  <text
    x="64"
    y="68"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="50"
    font-weight="400"
    fill="#1a1a1a"
    text-anchor="middle"
  >RC</text>
</svg>
